[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solpredict"
version = "1.0.0"
description = "Day-ahead solar irradiance forecasting for Ibri, Oman, from NASA POWER data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Alhanoof Al Buraiki" }]
dependencies = ["numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5", "matplotlib>=3.8", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
solpredict = "solpredict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
